name: Publish to PyPI

# Deploy when a version tag is pushed (e.g. v0.1.7 or 0.1.7).
# The tagged commit must be on the Production branch.
on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to be on Production
        run: |
          set -euo pipefail
          git fetch origin Production:refs/remotes/origin/Production
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/Production; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the Production branch."
            echo "Create the tag from a commit that is already on Production."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} is on Production (${GITHUB_SHA})"

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag must look like 0.1.7 or v0.1.7 (got: ${TAG})"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing tamilPY ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pyproject.toml version from tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]*(")',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find version = \"...\" in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          print(f"Updated pyproject.toml version -> {version}")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Show dist artifacts
        run: ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
